<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<a href="/claudechat.html">
  Open Claude Chat
</a>
  <title>Hiring Buddy</title>

  <script src="https://js.puter.com/v2/"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      max-width:1000px;
      margin:40px auto;
      padding:20px;
    }

    h1{
      margin-bottom:20px;
    }

    textarea{
      width:100%;
      min-height:220px;
      padding:15px;
      border-radius:10px;
      border:none;
      margin-bottom:20px;
      font-size:14px;
      background:#1e293b;
      color:white;
      resize:vertical;
    }

    button{
      background:#38bdf8;
      color:black;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      font-size:14px;
      margin-right:10px;
      margin-bottom:10px;
    }

    button:hover{
      opacity:0.9;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:16px;
      margin-top:20px;
    }

    .strong-approve{
      border-left:6px solid #22c55e;
    }

    .approve{
      border-left:6px solid #84cc16;
    }

    .reject{
      border-left:6px solid #f97316;
    }

    .strong-reject{
      border-left:6px solid #ef4444;
    }

    .loading{
      margin-top:20px;
      opacity:0.7;
    }

    ul{
      padding-left:20px;
    }

    li{
      margin-bottom:8px;
    }

    .chat-bubble{
      background:#1e293b;
      padding:15px;
      border-radius:12px;
      margin-top:12px;
    }

    .user{
      border-left:5px solid #38bdf8;
    }

    .assistant{
      border-left:5px solid #22c55e;
    }

    .section-title{
      margin-top:40px;
      margin-bottom:10px;
      font-size:20px;
    }

    pre{
      white-space:pre-wrap;
    }
  </style>
</head>
<body>

  <h1>Hiring Buddy</h1>

  <h2>Candidate Information</h2>

  <textarea
    id="candidateInput"
    placeholder="Paste LinkedIn profile, resume, or candidate notes here..."
  ></textarea>

  <button onclick="evaluateCandidate()">
    Evaluate Candidate
  </button>

  <button onclick="resetConversation()">
    Reset Conversation
  </button>

  <div id="output"></div>

  <div class="section-title">
    Continue Conversation
  </div>

  <textarea
    id="followupInput"
    placeholder="Ask follow-up questions like:
- Be harsher on frontend weaknesses
- Compare against Pipeline role
- Would you still approve for a startup?
- Focus more on ownership signals"
    style="min-height:120px;"
  ></textarea>

  <button onclick="continueConversation()">
    Send Follow-Up
  </button>

  <div id="conversation" style="display:none;"></div>

<script>

const SYSTEM_PROMPT = `
You are an elite technical sourcer evaluating candidates for Schemata.

Roles:
1. Fullstack Engineer
2. Pipeline Engineer
3. UX Engineer

Important signals:
- React
- Next.js
- TypeScript
- Python
- FastAPI
- AWS
- Infrastructure ownership
- Scaled applications
- Strong systems thinking
- Startup mentality
- Ownership mentality
- 3D / AR / VR exposure
- Side projects
- Strong communication

Decision must be ONE of:
- Strong Approve
- Approve
- Reject
- Strong Reject

Return ONLY valid JSON.

DO NOT:
- use markdown
- wrap in code fences
- explain outside JSON

Format:

{
  "candidate_name": "",
  "role_fit": "",
  "decision": "",
  "confidence": "",
  "strengths": [],
  "concerns": [],
  "final_comment": ""
}
`;

let messages = [
  {
    role: "system",
    content: SYSTEM_PROMPT
  }
];

function addConversationBubble(role, text){

  const conversation =
    document.getElementById("conversation");

  const bubble = document.createElement("div");

  bubble.className =
    `chat-bubble ${role}`;

  bubble.innerHTML = `
    <strong>
      ${role === 'user' ? 'You' : 'AI'}
    </strong>

    <pre>${text}</pre>
  `;

  conversation.appendChild(bubble);
}

async function evaluateCandidate(){

  const candidateData =
    document.getElementById("candidateInput").value.trim();

  const output =
    document.getElementById("output");

  if(!candidateData){

    output.innerHTML = `
      <div class="card reject">
        Please paste candidate information.
      </div>
    `;

    return;
  }

  output.innerHTML = `
    <div class="loading">
      Evaluating candidate...
    </div>
  `;

  try {

    messages.push({
      role: "user",
      content: candidateData
    });

    addConversationBubble(
      "user",
      candidateData
    );

    const response = await puter.ai.chat(
      messages,
      {
        model: "claude-sonnet-4-6"
      }
    );

    const text =
      response.message.content[0].text;

    console.log("RAW RESPONSE:", text);

    messages.push({
      role: "assistant",
      content: text
    });

    addConversationBubble(
      "assistant",
      text
    );

    const result =
      parseAIResponse(text);

    renderResult(result);

  } catch(err){

    console.error(err);

    output.innerHTML = `
      <div class="card strong-reject">
        <h2>Error</h2>

        <p>${err.message}</p>

        <p>
          Open console for debugging.
        </p>
      </div>
    `;
  }
}

async function continueConversation(){

  const followup =
    document.getElementById("followupInput").value.trim();

  const output =
    document.getElementById("output");

  if(!followup){
    return;
  }

  output.innerHTML += `
    <div class="loading">
      Thinking...
    </div>
  `;

  try {

    messages.push({
      role: "user",
      content: followup
    });

    addConversationBubble(
      "user",
      followup
    );

    const response = await puter.ai.chat(
      messages,
      {
        model: "claude-sonnet-4-6"
      }
    );

    const text =
      response.message.content[0].text;

    console.log("FOLLOWUP RESPONSE:", text);

    messages.push({
      role: "assistant",
      content: text
    });

    addConversationBubble(
      "assistant",
      text
    );

    const result =
      parseAIResponse(text);

    renderResult(result);

  } catch(err){

    console.error(err);

    output.innerHTML += `
      <div class="card reject">
        Failed follow-up parse.
      </div>
    `;
  }
}

function parseAIResponse(text){

  let cleaned = text.trim();

  cleaned = cleaned.replace(/```json/g, '');
  cleaned = cleaned.replace(/```/g, '');

  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');

  if(start === -1 || end === -1){
    throw new Error(
      "No valid JSON found in AI response"
    );
  }

  cleaned =
    cleaned.substring(start, end + 1);

  console.log("CLEANED:", cleaned);

  return JSON.parse(cleaned);
}

function renderResult(data){

  const output =
    document.getElementById("output");

  const decisionClass =
    data.decision
      .toLowerCase()
      .replace(/\s/g, '-');

  output.innerHTML = `
    <div class="card ${decisionClass}">

      <h2>
        ${data.candidate_name || "Unknown Candidate"}
      </h2>

      <p>
        <strong>Role Fit:</strong>
        ${data.role_fit}
      </p>

      <p>
        <strong>Decision:</strong>
        ${data.decision}
      </p>

      <p>
        <strong>Confidence:</strong>
        ${data.confidence}
      </p>

      <h3>Strengths</h3>

      <ul>
        ${
          (data.strengths || [])
            .map(
              item => `<li>${item}</li>`
            )
            .join("")
        }
      </ul>

      <h3>Concerns</h3>

      <ul>
        ${
          (data.concerns || [])
            .map(
              item => `<li>${item}</li>`
            )
            .join("")
        }
      </ul>

      <p>
        <strong>Final Comment:</strong>
        ${data.final_comment}
      </p>

    </div>
  `;
}

function resetConversation(){

  messages = [
    {
      role: "system",
      content: SYSTEM_PROMPT
    }
  ];

  document.getElementById("conversation")
    .innerHTML = "";

  document.getElementById("output")
    .innerHTML = "";

  document.getElementById("candidateInput")
    .value = "";

  document.getElementById("followupInput")
    .value = "";
}

</script>

</body>
</html>
