<!DOCTYPE html>
<html lang="en">
<head>


  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Claude Chat</title>

  <script src="https://js.puter.com/v2/"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      flex-direction:column;
      height:100vh;
    }

    .header{
      padding:20px;
      border-bottom:1px solid #1e293b;
      font-size:20px;
      font-weight:bold;
    }

    #chat{
      flex:1;
      overflow-y:auto;
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .message{
      max-width:80%;
      padding:14px 18px;
      border-radius:16px;
      line-height:1.6;
      white-space:pre-wrap;
    }

    .user{
      align-self:flex-end;
      background:#38bdf8;
      color:black;
    }

    .assistant{
      align-self:flex-start;
      background:#1e293b;
      color:white;
    }

    .input-area{
      display:flex;
      gap:10px;
      padding:20px;
      border-top:1px solid #1e293b;
      background:#0f172a;
    }

    textarea{
      flex:1;
      resize:none;
      border:none;
      border-radius:12px;
      padding:14px;
      background:#1e293b;
      color:white;
      font-size:15px;
      min-height:60px;
      outline:none;
    }

    button{
      border:none;
      background:#38bdf8;
      color:black;
      padding:0 20px;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      font-size:15px;
    }

    button:hover{
      opacity:0.9;
    }

    .typing{
      opacity:0.7;
      font-style:italic;
    }

    pre{
      margin:0;
      white-space:pre-wrap;
      word-wrap:break-word;
    }
  </style>
</head>
<body>

  <div class="header">
    Claude Chat
  </div>

  <div id="chat"></div>

  <div class="input-area">

    <textarea
      id="prompt"
      placeholder="Ask Claude anything..."
    ></textarea>

    <button onclick="sendMessage()">
      Send
    </button>

  </div>

<script>

const messages = [];

function addMessage(role, text){

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    `message ${role}`;

  div.innerHTML =
    `<pre>${text}</pre>`;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}

async function sendMessage(){

  const input =
    document.getElementById("prompt");

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  addMessage("user", text);

  messages.push({
    role:"user",
    content:text
  });

  input.value = "";

  const chat =
    document.getElementById("chat");

  const typing =
    document.createElement("div");

  typing.className =
    "message assistant typing";

  typing.innerText =
    "Claude is thinking...";

  chat.appendChild(typing);

  chat.scrollTop =
    chat.scrollHeight;

  try {

    const response =
      await puter.ai.chat(
        messages,
        {
          model:"claude-sonnet-4-6"
        }
      );

    typing.remove();

    const reply =
      response.message.content[0].text;

    addMessage(
      "assistant",
      reply
    );

    messages.push({
      role:"assistant",
      content:reply
    });

  } catch(err){

    typing.remove();

    addMessage(
      "assistant",
      "Error: " + err.message
    );

    console.error(err);
  }
}

document
  .getElementById("prompt")
  .addEventListener(
    "keydown",
    function(e){

      if(
        e.key === "Enter" &&
        !e.shiftKey
      ){
        e.preventDefault();
        sendMessage();
      }
    }
  );

</script>

</body>
</html>
